stages: [build, deploy]

variables:
  GIT_STRATEGY: "none"   # <-- GitLab НЕ будет делать checkout сам

.common_setup: &common_setup
  - sudo chown -R gitlab-runner:gitlab-runner "$CI_PROJECT_DIR" || true
  - sudo find "$CI_PROJECT_DIR" -type d -name "__pycache__" -exec rm -rf {} + || true
  - sudo rm -rf "$CI_PROJECT_DIR/media" || true
  # Ручной checkout именно того коммита, который запускает пайплайн
  - git -C "$CI_PROJECT_DIR" init || true
  - git -C "$CI_PROJECT_DIR" remote remove origin 2>/dev/null || true
  - git -C "$CI_PROJECT_DIR" remote add origin "$CI_REPOSITORY_URL"
  - git -C "$CI_PROJECT_DIR" fetch --depth=1 origin "$CI_COMMIT_SHA"
  - git -C "$CI_PROJECT_DIR" reset --hard "$CI_COMMIT_SHA"
  - git -C "$CI_PROJECT_DIR" clean -ffdx

build-job:
  stage: build
  tags: [esep-ninja]
  before_script:
    - *common_setup
  script:
    - |
      cat > .env <<EOF
      DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE}
      MYSQL_HOST=${MYSQL_HOST}
      MYSQL_DATABASE=${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      PMA_HOST=${PMA_HOST}
      PMA_USER=${PMA_USER}
      PMA_PASSWORD=${PMA_PASSWORD}
      UPLOAD_LIMIT=${UPLOAD_LIMIT}
      ESEP_DB_HOST=${ESEP_DB_HOST}
      ESEP_DB_USER=${ESEP_DB_USER}
      ESEP_DB_PASSWORD=${ESEP_DB_PASSWORD}
      ESEP_DB_NAME=${ESEP_DB_NAME}
      EOF
    - docker-compose -f docker-compose.yml build --pull
  artifacts:
    paths: [.env]
    expire_in: 1 hour

deploy-job:
  stage: deploy
  tags: [esep-ninja]
  needs: ["build-job"]
  dependencies: ["build-job"]
  before_script:
    - *common_setup
  script:
    - docker-compose -f docker-compose.yml down --remove-orphans || true
    - docker-compose -f docker-compose.yml up -d --build --force-recreate --remove-orphans
    - docker ps | grep -E 'esep|ninja' || echo "No containers found"
  only: [main, develop]
